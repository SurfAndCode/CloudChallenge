name: Deploy Static Web App

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'                 # ← REQUIRED
          app_location: FrontEnd           # your frontend folder
          output_location: dist            # Vite/Vue/Svelte/Next export = dist; CRA = build; plain static = ""
          api_location: ""                 # you use a separate Functions app (counterAPI)
          repo_token: ${{ secrets.GITHUB_TOKEN }}   # optional, helps with PR annotations
