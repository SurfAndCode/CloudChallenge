name: Deploy Static Web App

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (Optional) set up Node.js if your FrontEnd uses npm/yarn
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The deploy step (build is auto-run if a package.json exists)
      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

          # Your front-end source folder
          app_location: FrontEnd

          # If your framework outputs to "dist" (Vite/Vue/Svelte/Next export): use "dist"
          # If Create React App: use "build"
          # If plain static (no build): set to "" and make sure files live in FrontEnd
          output_location: dist

          # You’re using a separate Azure Functions app (counterAPI), so leave this empty
          api_location: ""
