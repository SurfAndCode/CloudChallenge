name: CI → Deploy DEV → Smoke → Promote PROD

on:
  push:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - 'Infra/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - 'Infra/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Code layout (infra names come from Terraform outputs)
  FUNCTIONS_DIR: BackEnd
  STATIC_DIR: FrontEnd

concurrency:
  group: cloudchallenge
  cancel-in-progress: true

jobs:
  # =========================
  # 0) Build Functions ZIP (can run while infra_dev runs)
  # =========================
  build_functions:
    name: Build Functions zip (Python v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.FUNCTIONS_DIR }}/requirements.txt

      - name: Vendor deps into .python_packages
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          rm -rf .python_packages
          mkdir -p .python_packages/lib/site-packages
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target .python_packages/lib/site-packages

      - name: Verify required files exist
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          test -f host.json
          test -f function_app.py

      - name: Create functionapp.zip
        run: |
          cd "${{ env.FUNCTIONS_DIR }}"
          zip -r ../functionapp.zip . \
            -x "**/__pycache__/*" ".venv/*" "**/.pytest_cache/*" ".git/*"
          ls -lh ../functionapp.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-zip
          path: functionapp.zip
          if-no-files-found: error

  # =========================
  # 1) Terraform: DEV infra
  # =========================
  infra_dev:
    name: Terraform (DEV)
    environment: dev
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    defaults: { run: { working-directory: Infra } }
    env:
      TF_IN_AUTOMATION: "1"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Init DEV state
        run: terraform init -input=false -reconfigure -backend-config="key=cloudchallenge/dev.tfstate"

      - name: Validate
        run: terraform validate

      # Simple tweak: -lock=false on plan to avoid stale lock during planning
      - name: Plan (DEV)
        run: terraform plan -input=false -lock=false -var-file=env/dev.tfvars -out=tfplan

      - name: Apply (DEV)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export DEV outputs
        id: tf_out_dev
        run: |
          echo "rg=$(terraform output -raw rg_name)"                                  >> $GITHUB_OUTPUT
          echo "func_name=$(terraform output -raw function_app_name)"                 >> $GITHUB_OUTPUT
          echo "swa_name=$(terraform output -raw swa_name)"                           >> $GITHUB_OUTPUT
          echo "api=https://$(terraform output -raw function_default_hostname)"       >> $GITHUB_OUTPUT
          echo "swa=https://$(terraform output -raw swa_default_hostname)"            >> $GITHUB_OUTPUT
          echo "site_url=$(terraform output -raw site_url)"                           >> $GITHUB_OUTPUT
    outputs:
      rg:        ${{ steps.tf_out_dev.outputs.rg }}
      func_name: ${{ steps.tf_out_dev.outputs.func_name }}
      swa_name:  ${{ steps.tf_out_dev.outputs.swa_name }}
      api:       ${{ steps.tf_out_dev.outputs.api }}
      swa:       ${{ steps.tf_out_dev.outputs.swa }}
      site_url:  ${{ steps.tf_out_dev.outputs.site_url }}

  # =========================
  # 2) Deploy DEV (Functions + SWA)
  # =========================
  deploy_dev:
    name: Deploy to DEV (Functions + SWA)
    environment: dev
    runs-on: ubuntu-latest
    needs: [infra_dev, build_functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      AZ_RG:        ${{ needs.infra_dev.outputs.rg }}
      AZ_FUNC_NAME: ${{ needs.infra_dev.outputs.func_name }}
      AZ_SWA_NAME:  ${{ needs.infra_dev.outputs.swa_name }}
      API_BASE_URL: ${{ needs.infra_dev.outputs.api }}
      SWA_DEFAULT:  ${{ needs.infra_dev.outputs.swa }}
      SITE_URL:     ${{ needs.infra_dev.outputs.site_url }}
    outputs:
      swa: ${{ steps.dev_out.outputs.swa }}
      api: ${{ steps.dev_out.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-zip
          path: _dist

      - name: Show values from infra_dev
        shell: bash
        run: |
          echo "SUB: $(az account show --query id -o tsv)"
          echo "TENANT: $(az account show --query tenantId -o tsv)"
          echo "RG=$AZ_RG"
          echo "FUNC=$AZ_FUNC_NAME"
          echo "SWA=$AZ_SWA_NAME"
          echo "API_BASE_URL=$API_BASE_URL"
          echo "SWA_DEFAULT=$SWA_DEFAULT"
          echo "SITE_URL=$SITE_URL"

      - name: Verify Function App exists in this subscription
        shell: bash
        run: |
          set -e
          az functionapp show -g "${AZ_RG}" -n "${AZ_FUNC_NAME}" --query "name" -o tsv

      - name: Deploy Functions (DEV)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZ_FUNC_NAME }}
          package: _dist/functionapp.zip
        # If you migrate to Flex Consumption, replace this step (ask for snippet).

      - name: Add CORS for DEV Function App
        shell: bash
        run: |
          az functionapp cors remove -g "${AZ_RG}" -n "${AZ_FUNC_NAME}" --allowed-origins '*' || true
          if [ -n "${SITE_URL}" ]; then
            az functionapp cors add -g "${AZ_RG}" -n "${AZ_FUNC_NAME}" --allowed-origins "${SWA_DEFAULT}" "${SITE_URL}"
          else
            az functionapp cors add -g "${AZ_RG}" -n "${AZ_FUNC_NAME}" --allowed-origins "${SWA_DEFAULT}"
          fi

      - name: Stamp DEV API base into appconfig.js
        shell: bash
        run: echo "window.__APP_CONFIG__={apiBase:'${API_BASE_URL}'};" > FrontEnd/appconfig.js

      # Fetch SWA token at runtime (DEV)
      - name: Get SWA deployment token (DEV)
        id: swa_token_dev
        shell: bash
        run: |
          TOKEN=$(az staticwebapp secrets list -g "${AZ_RG}" -n "${AZ_SWA_NAME}" --query properties.apiKey -o tsv)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            TOKEN=$(az staticwebapp secrets list -g "${AZ_RG}" -n "${AZ_SWA_NAME}" --query properties.deploymentToken -o tsv)
          fi
          echo "token=${TOKEN}" >> $GITHUB_OUTPUT

      - name: Deploy SWA (DEV) — static files only
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ steps.swa_token_dev.outputs.token }}
          app_location: ${{ env.STATIC_DIR }}
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - name: Expose DEV endpoints
        id: dev_out
        shell: bash
        run: |
          echo "swa=${SWA_DEFAULT}"  >> $GITHUB_OUTPUT
          echo "api=${API_BASE_URL}" >> $GITHUB_OUTPUT

  # =========================
  # 3) Smoke DEV
  # =========================
  smoke_dev:
    name: Smoke test DEV (Cypress)
    environment: dev
    runs-on: ubuntu-latest
    needs: [deploy_dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Smoke
    env:
      CYPRESS_apiBaseUrl: ${{ needs.deploy_dev.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Run Cypress smoke
        uses: cypress-io/github-action@v6
        with:
          working-directory: Smoke

  # =========================
  # 4) Terraform: PROD infra (runs AFTER smoke passes)
  # =========================
  infra_prod:
    name: Terraform (PROD)
    environment: prod
    runs-on: ubuntu-latest
    needs: [smoke_dev]
    permissions: { id-token: write, contents: read }
    defaults: { run: { working-directory: Infra } }
    env:
      TF_IN_AUTOMATION: "1"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Init PROD state
        run: terraform init -input=false -reconfigure -backend-config="key=cloudchallenge/prod.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan (PROD)
        run: terraform plan -input=false -lock=false -var-file=env/prod.tfvars -out=tfplan

      - name: Apply (PROD)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export PROD outputs
        id: tf_out_prod
        run: |
          echo "rg=$(terraform output -raw rg_name)"                                  >> $GITHUB_OUTPUT
          echo "func_name=$(terraform output -raw function_app_name)"                 >> $GITHUB_OUTPUT
          echo "swa_name=$(terraform output -raw swa_name)"                           >> $GITHUB_OUTPUT
          echo "api=https://$(terraform output -raw function_default_hostname)"       >> $GITHUB_OUTPUT
          echo "swa=https://$(terraform output -raw swa_default_hostname)"            >> $GITHUB_OUTPUT
          echo "site_url=$(terraform output -raw site_url)"                           >> $GITHUB_OUTPUT
    outputs:
      rg:        ${{ steps.tf_out_prod.outputs.rg }}
      func_name: ${{ steps.tf_out_prod.outputs.func_name }}
      swa_name:  ${{ steps.tf_out_prod.outputs.swa_name }}
      api:       ${{ steps.tf_out_prod.outputs.api }}
      swa:       ${{ steps.tf_out_prod.outputs.swa }}
      site_url:  ${{ steps.tf_out_prod.outputs.site_url }}

  # =========================
  # 5) Deploy PROD (Functions + SWA)
  # =========================
  deploy_prod:
    name: Promote to PROD (Functions + SWA)
    environment: prod
    runs-on: ubuntu-latest
    needs: [infra_prod, build_functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      AZ_RG:        ${{ needs.infra_prod.outputs.rg }}
      AZ_FUNC_NAME: ${{ needs.infra_prod.outputs.func_name }}
      AZ_SWA_NAME:  ${{ needs.infra_prod.outputs.swa_name }}
      API_BASE_URL: ${{ needs.infra_prod.outputs.api }}
      SWA_DEFAULT:  ${{ needs.infra_prod.outputs.swa }}
      SITE_URL:     ${{ needs.infra_prod.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-zip
          path: _dist

      - name: Deploy Functions (PROD)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZ_FUNC_NAME }}
          package: _dist/functionapp.zip

      - name: Add CORS for PROD Function App
        shell: bash
        run: |
          az functionapp cors remove -g "${AZ_RG}" -n "${AZ_FUNC_NAME}" --allowed-origins '*' || true
          if [ -n "${SITE_URL}" ]; then
            az functionapp cors add -g "${AZ_RG}" -n "${AZ_FUNC_NAME}" --allowed-origins "${SWA_DEFAULT}" "${SITE_URL}"
          else
            az functionapp cors add -g "${AZ_RG}" -n "${AZ_FUNC_NAME}" --allowed-origins "${SWA_DEFAULT}"
          fi

      - name: Stamp PROD API base into appconfig.js
        shell: bash
        run: echo "window.__APP_CONFIG__={apiBase:'${API_BASE_URL}'};" > FrontEnd/appconfig.js

      # Fetch SWA token at runtime (PROD)
      - name: Get SWA deployment token (PROD)
        id: swa_token_prod
        shell: bash
        run: |
          TOKEN=$(az staticwebapp secrets list -g "${AZ_RG}" -n "${AZ_SWA_NAME}" --query properties.apiKey -o tsv)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            TOKEN=$(az staticwebapp secrets list -g "${AZ_RG}" -n "${AZ_SWA_NAME}" --query properties.deploymentToken -o tsv)
          fi
          echo "token=${TOKEN}" >> $GITHUB_OUTPUT

      - name: Deploy SWA (PROD) — static files only
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ steps.swa_token_prod.outputs.token }}
          app_location: ${{ env.STATIC_DIR }}
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
