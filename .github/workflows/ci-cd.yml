name: CI → Deploy DEV → Smoke → Promote PROD

on:
  push:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # ===== adjust to match your Terraform resource names =====
  # DEV
  FUNCTIONAPP_NAME_DEV: cloudchallenge-dev-func
  FUNCTIONAPP_RG_DEV: rg-cloudchallenge-dev
  SWA_NAME_DEV: cloudchallenge-dev-swa
  SITE_URL_DEV: https://dev.zoltanolasz.com

  # PROD
  FUNCTIONAPP_NAME_PROD: counterAPI
  FUNCTIONAPP_RG_PROD: CloudChallenge
  SWA_NAME_PROD: CloudChallenge
  SITE_URL_PROD: https://zoltanolasz.com   # or https://www.zoltanolasz.com

  # Code layout
  FUNCTIONS_DIR: BackEnd
  SWA_APP_LOCATION: FrontEnd
  SWA_OUTPUT_LOCATION: ""   # 'dist' or 'build' if you have a build step

jobs:
  build_functions:
    name: Build Functions zip (Python v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.FUNCTIONS_DIR }}/requirements.txt

      - name: Vendor deps into .python_packages
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          rm -rf .python_packages
          mkdir -p .python_packages/lib/site-packages
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target .python_packages/lib/site-packages

      - name: Verify required files exist
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          test -f host.json
          test -f function_app.py

      - name: Create functionapp.zip
        run: |
          cd "${{ env.FUNCTIONS_DIR }}"
          zip -r ../functionapp.zip . \
            -x "**/__pycache__/*" ".venv/*" "**/.pytest_cache/*" ".git/*"
          ls -lh ../functionapp.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-zip
          path: functionapp.zip
          if-no-files-found: error

  deploy_dev:
    name: Deploy to DEV (Functions + SWA)
    runs-on: ubuntu-latest
    needs: [build_functions]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-zip
          path: _dist

      - name: Deploy Functions (DEV)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME_DEV }}
          package: _dist/functionapp.zip

      - name: Add CORS for DEV Function App (SWA default + custom URL)
        shell: bash
        run: |
          SWA_HOST=$(az staticwebapp show -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.SWA_NAME_DEV }}" --query defaultHostname -o tsv)
          az functionapp cors remove -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.FUNCTIONAPP_NAME_DEV }}" --allowed-origins '*' || true
          az functionapp cors add    -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.FUNCTIONAPP_NAME_DEV }}" --allowed-origins "https://${SWA_HOST}" "${{ env.SITE_URL_DEV }}"

      - name: Deploy SWA (DEV)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_DEV }}
          app_location: ${{ env.SWA_APP_LOCATION }}
          output_location: ${{ env.SWA_OUTPUT_LOCATION }}
          production_branch: main

      - name: Expose DEV endpoints for downstream jobs
        id: dev_out
        shell: bash
        run: |
          SWA_HOST=$(az staticwebapp show -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.SWA_NAME_DEV }}" --query defaultHostname -o tsv)
          FUNC_HOST=$(az functionapp show -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.FUNCTIONAPP_NAME_DEV }}" --query defaultHostName -o tsv)
          echo "swa=https://${SWA_HOST}"   >> $GITHUB_OUTPUT
          echo "api=https://${FUNC_HOST}"  >> $GITHUB_OUTPUT

  smoke_dev:
    name: Smoke test DEV (Cypress)
    runs-on: ubuntu-latest
    needs: [deploy_dev]
    defaults:
      run:
        working-directory: Smoke
    env:
      CYPRESS_baseUrl: ${{ needs.deploy_dev.outputs.swa }}
      CYPRESS_apiBaseUrl: ${{ needs.deploy_dev.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Run Cypress smoke
        uses: cypress-io/github-action@v6
        with:
          working-directory: Smoke

  deploy_prod:
    name: Promote to PROD (Functions + SWA)
    runs-on: ubuntu-latest
    needs: [smoke_dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod   # optional: use GH Environments for approvals/protection
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-zip
          path: _dist

      - name: Deploy Functions (PROD)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME_PROD }}
          package: _dist/functionapp.zip

      - name: Add CORS for PROD Function App (SWA default + custom URL)
        shell: bash
        run: |
          SWA_HOST=$(az staticwebapp show -g "${{ env.FUNCTIONAPP_RG_PROD }}" -n "${{ env.SWA_NAME_PROD }}" --query defaultHostname -o tsv)
          az functionapp cors remove -g "${{ env.FUNCTIONAPP_RG_PROD }}" -n "${{ env.FUNCTIONAPP_NAME_PROD }}" --allowed-origins '*' || true
          az functionapp cors add    -g "${{ env.FUNCTIONAPP_RG_PROD }}" -n "${{ env.FUNCTIONAPP_NAME_PROD }}" --allowed-origins "https://${SWA_HOST}" "${{ env.SITE_URL_PROD }}"

      - name: Deploy SWA (PROD)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_PROD }}
          app_location: ${{ env.SWA_APP_LOCATION }}
          output_location: ${{ env.SWA_OUTPUT_LOCATION }}
          production_branch: main
