name: CI → Deploy DEV → Smoke → Promote PROD

on:
  push:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # ===== adjust to match your Azure resource names =====
  # DEV
  FUNCTIONAPP_NAME_DEV: cloudchallenge-dev-func
  FUNCTIONAPP_RG_DEV: rg-cloudchallenge-dev
  SWA_NAME_DEV: cloudchallenge-dev-swa
  SITE_URL_DEV: https://dev.zoltanolasz.com

  # PROD
  FUNCTIONAPP_NAME_PROD: counterAPI
  FUNCTIONAPP_RG_PROD: CloudChallenge
  SWA_NAME_PROD: CloudChallenge
  SITE_URL_PROD: https://zoltanolasz.com

  # Code layout
  FUNCTIONS_DIR: BackEnd
  STATIC_DIR: FrontEnd   # <-- your static files live here

concurrency:
  group: swa-deploy
  cancel-in-progress: true

jobs:
  build_functions:
    name: Build Functions zip (Python v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.FUNCTIONS_DIR }}/requirements.txt

      - name: Vendor deps into .python_packages
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          rm -rf .python_packages
          mkdir -p .python_packages/lib/site-packages
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target .python_packages/lib/site-packages

      - name: Verify required files exist
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          test -f host.json
          test -f function_app.py

      - name: Create functionapp.zip
        run: |
          cd "${{ env.FUNCTIONS_DIR }}"
          zip -r ../functionapp.zip . \
            -x "**/__pycache__/*" ".venv/*" "**/.pytest_cache/*" ".git/*"
          ls -lh ../functionapp.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-zip
          path: functionapp.zip
          if-no-files-found: error

  deploy_dev:
    name: Deploy to DEV (Functions + SWA)
    runs-on: ubuntu-latest
    needs: [build_functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      swa: ${{ steps.dev_out.outputs.swa }}
      api: ${{ steps.dev_out.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-zip
          path: _dist

      - name: Deploy Functions (DEV)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME_DEV }}
          package: _dist/functionapp.zip

      - name: Add CORS for DEV Function App (SWA default + custom URL)
        shell: bash
        run: |
          SWA_HOST=$(az staticwebapp show -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.SWA_NAME_DEV }}" --query defaultHostname -o tsv)
          az functionapp cors remove -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.FUNCTIONAPP_NAME_DEV }}" --allowed-origins '*' || true
          az functionapp cors add    -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.FUNCTIONAPP_NAME_DEV }}" --allowed-origins "https://${SWA_HOST}" "${{ env.SITE_URL_DEV }}"

      - name: Deploy SWA (DEV) — static files, no build
        # Avoid failing on fork PRs where secrets aren't available:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_DEV }}
          app_location: ${{ env.STATIC_DIR }}   # <-- just upload this folder
          output_location: ""                   # not used
          skip_app_build: true                  # don't run Oryx
          skip_api_build: true
          production_branch: main

      - name: Expose DEV endpoints for downstream jobs
        id: dev_out
        shell: bash
        run: |
          SWA_HOST=$(az staticwebapp show -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.SWA_NAME_DEV }}" --query defaultHostname -o tsv)
          FUNC_HOST=$(az functionapp show -g "${{ env.FUNCTIONAPP_RG_DEV }}" -n "${{ env.FUNCTIONAPP_NAME_DEV }}" --query defaultHostName -o tsv)
          echo "swa=https://${SWA_HOST}"   >> $GITHUB_OUTPUT
          echo "api=https://${FUNC_HOST}"  >> $GITHUB_OUTPUT

      - name: Close SWA preview (on PR close)
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: close
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_DEV }}
          app_location: ${{ env.STATIC_DIR }}
          output_location: ""

  smoke_dev:
    name: Smoke test DEV (Cypress)
    runs-on: ubuntu-latest
    needs: [deploy_dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Smoke
    env:
      CYPRESS_apiBaseUrl: ${{ needs.deploy_dev.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Verify tools (debug)
        run: |
          node -v
          npm -v

      - name: Verify Cypress
        run: npx cypress verify

      - name: Debug API URL
        run: echo "API -> ${{ env.CYPRESS_apiBaseUrl }}"
        
      - name: Run Cypress smoke
        uses: cypress-io/github-action@v6
        with:
          working-directory: Smoke

  deploy_prod:
    name: Promote to PROD (Functions + SWA)
    runs-on: ubuntu-latest
    needs: [smoke_dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-zip
          path: _dist

      - name: Deploy Functions (PROD)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME_PROD }}
          package: _dist/functionapp.zip

      - name: Add CORS for PROD Function App (SWA default + custom URL)
        shell: bash
        run: |
          SWA_HOST=$(az staticwebapp show -g "${{ env.FUNCTIONAPP_RG_PROD }}" -n "${{ env.SWA_NAME_PROD }}" --query defaultHostname -o tsv)
          az functionapp cors remove -g "${{ env.FUNCTIONAPP_RG_PROD }}" -n "${{ env.FUNCTIONAPP_NAME_PROD }}" --allowed-origins '*' || true
          az functionapp cors add    -g "${{ env.FUNCTIONAPP_RG_PROD }}" -n "${{ env.FUNCTIONAPP_NAME_PROD }}" --allowed-origins "https://${SWA_HOST}" "${{ env.SITE_URL_PROD }}"

      - name: Deploy SWA (PROD) — static files, no build
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_PROD }}
          app_location: ${{ env.STATIC_DIR }}
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
