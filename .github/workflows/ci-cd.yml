name: CI → Deploy DEV → Smoke → Promote PROD

on:
  push:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'Smoke/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # ===== adjust to match your Azure resource names =====
  # DEV
  FUNCTIONAPP_NAME_DEV: cloudchallenge-dev-func
  FUNCTIONAPP_RG_DEV: rg-cloudchallenge-dev
  SWA_NAME_DEV: cloudchallenge-dev-swa
  SITE_URL_DEV: https://dev.zoltanolasz.com

  # PROD
  FUNCTIONAPP_NAME_PROD: counterAPI
  FUNCTIONAPP_RG_PROD: CloudChallenge
  SWA_NAME_PROD: CloudChallenge
  SITE_URL_PROD: https://zoltanolasz.com

  # Code layout
  FUNCTIONS_DIR: BackEnd
  STATIC_DIR: FrontEnd   # <-- your static files live here

concurrency:
  group: swa-deploy
  cancel-in-progress: true

jobs:
  build_functions:
    name: Build Functions zip (Python v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.FUNCTIONS_DIR }}/requirements.txt

      - name: Vendor deps into .python_packages
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          rm -rf .python_packages
          mkdir -p .python_packages/lib/site-packages
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target .python_packages/lib/site-packages

      - name: Verify required files exist
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: |
          test -f host.json
          test -f function_app.py

      - name: Create functionapp.zip
        run: |
          cd "${{ env.FUNCTIONS_DIR }}"
          zip -r ../functionapp.zip . \
            -x "**/__pycache__/*" ".venv/*" "**/.pytest_cache/*" ".git/*"
          ls -lh ../functionapp.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-zip
          path: functionapp.zip
          if-no-files-found: error

  deploy_dev:
    name: D
