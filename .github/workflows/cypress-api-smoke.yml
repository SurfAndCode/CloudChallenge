name: Cypress API Smoke

on:
  push:
    branches: ["**"]
    paths:
      - "BackEnd/**"                 
      - "Smoke/**"
      - ".github/workflows/cypress-api-smoke.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "BackEnd/**"
      - "Smoke/**"
      - ".github/workflows/cypress-api-smoke.yml"

concurrency:
  group: cypress-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smoke/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Verify Cypress
        run: npx cypress verify
      - name: Run Cypress (API smoke)
        run: npx cypress run --spec "cypress/e2e/smoke/**/*.cy.*"
        env:
          CYPRESS_BASE_URL: https://counterapi-a5aeacedhma9ecev.australiasoutheast-01.azurewebsites.net
          # Optional overrides:
          # CYPRESS_HEALTH_PATH: /api/health
          # For PRs you might set this to false via env or a job condition:
          # CYPRESS_ALLOW_MUTATION: "false"
