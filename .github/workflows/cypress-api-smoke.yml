name: Cypress API Smoke

on:
  push:
    branches: ["**"]
    paths:
      - "BackEnd/**"                       
      - "Smoke/**"
      - ".github/workflows/cypress-api-smoke.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "BackEnd/**"
      - "Smoke/**"
      - ".github/workflows/cypress-api-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Smoke
    steps:
      - uses: actions/checkout@v4

      # Always install Node so npm is available (no cache here)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install deps (use ci if lockfile is present, otherwise install)
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify tools (debug)
        run: |
          node -v
          npm -v

      - name: Verify Cypress
        run: npx cypress verify

      - name: Run Cypress (API smoke)
        run: npx cypress run --spec "cypress/e2e/smoke/**/*.cy.*"
        env:
          CYPRESS_BASE_URL: https://counterapi-a5aeacedhma9ecev.australiasoutheast-01.azurewebsites.net
          # Optional:
          # CYPRESS_HEALTH_PATH: /api/health
          # CYPRESS_ALLOW_MUTATION: "false"   # skip POST increments on PRs
