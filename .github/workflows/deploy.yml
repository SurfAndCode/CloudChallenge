name: Deploy Azure Functions (Python)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'     # use 3.10 if your project uses that

      # Deploy using a publish profile secret (easiest path)
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: counterAPI              # your Function App name
          package: ./BackEnd                # deploy from BackEnd/ folder
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
