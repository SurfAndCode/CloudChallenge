name: Deploy Azure Function App (Python)

on:
  push:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - '.github/workflows/main_counterapi.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      APP_NAME: counterAPI

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Bundle dependencies into the artifact (Linux Functions expects this)
      - name: Bundle dependencies into .python_packages
        working-directory: BackEnd
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target ".python_packages/lib/site-packages"
          # sanity: prove azure.functions is in the package
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path(".python_packages/lib/site-packages").resolve()))
          import azure.functions
          print("azure.functions import OK")
          PY

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F973D9E64E684B118D6F201CC9D4AB22 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF85C72FBE354B9894D6BFDE4759F9ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC8A0FC42588424E85E120917C57ED9C }}

      - name: Deploy BackEnd to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.APP_NAME }}
          package: BackEnd

