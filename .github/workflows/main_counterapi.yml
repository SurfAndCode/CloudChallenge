name: Deploy Azure Function App (Python)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F973D9E64E684B118D6F201CC9D4AB22 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF85C72FBE354B9894D6BFDE4759F9ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC8A0FC42588424E85E120917C57ED9C }}

      # Deploy the BackEnd folder (the action zips it and sets WEBSITE_RUN_FROM_PACKAGE)
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: counterAPI
          package: BackEnd
